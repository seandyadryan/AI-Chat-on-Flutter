services:
  postgres:
    image: postgres:16
    container_name: ai-chat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aidb
      POSTGRES_USER: aiuser
      POSTGRES_PASSWORD: GantiPasswordKuat123!
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"

  api:
    build:
      context: ./server
    container_name: ai-chat-api
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - ./server/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    container_name: ai-chat-caddy
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/amarlo:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
